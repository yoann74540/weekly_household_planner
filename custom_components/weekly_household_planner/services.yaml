add_task:
  name: Add task
  description: Add a task to the weekly planner.
  fields:
    day:
      name: Day
      required: true
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

    who:
      name: Actor
      description: Actor that will perform the task.
      required: true
      selector:
        text:

    task:
      name: Task
      description: Task type defined in the planner.
      required: true
      selector:
        text:

    parameters:
      name: Parameters
      description: Additional parameters defined for this task.
      required: false
      selector:
        object:

    recurrence:
      name: Recurrence
      description: >
        Optional recurrence configuration.
        Use interval_weeks to specify the frequency and
        start_date (YYYY-MM-DD) to define the first occurrence.
        The start date must match the selected day.
      required: false
      example:
        interval_weeks: 2
        start_date: "2026-10-19"
      selector:
        object:

remove_task:
  name: Remove task
  description: Remove a task from the weekly planner.
  fields:
    id:
      name: Task ID
      required: true
      selector:
        text:

