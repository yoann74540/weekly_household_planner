    day:
      name: Day
      required: true
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

    who:
      name: Actor
      description: Actor that will perform the task.
      required: true
      selector:
        text:

    task:
      name: Task
      description: Task type defined in the planner.
      required: true
      selector:
        text:

    parameters:
      name: Parameters
