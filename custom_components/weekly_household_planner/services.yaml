        start_date: "2026-10-19"
      selector:
        object:

complete_task:
  name: Complete task
  description: Mark a task scheduled for today as completed or not completed.
  fields:
    task_id:
      name: Task ID
      description: ID of the task to complete. The task must be scheduled for today.
      required: true
      selector:
        text:

    completed:
      name: Completed
      description: Mark the task as completed or not completed.
      required: false
      default: true
      selector:
        boolean:

get_completions:
  name: Get completions
  description: Return the completion status of tasks scheduled for today.

get_schedule:
  name: Get schedule
  description: Return the complete weekly schedule.

get_definition:
  name: Get definition
  description: Return the planner definition.

get_tasks:
  name: Get tasks
  description: Return scheduled tasks matching optional filters.
  fields:
    day:
      name: Day
      description: Day to query. Use "today" for the current day.
      required: false
      selector:
        select:
          options:
            - today
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

    who:
      name: Actor
      description: Only return tasks assigned to this actor.
      required: false
      selector:
        text:

    task:
      name: Task
      description: Only return tasks of this type.
      required: false
      selector:
        text: